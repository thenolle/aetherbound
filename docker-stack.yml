services:
  game:
    image: aetherbound:dev
    environment:
      APP_ENV: production
      PORT: "8080"
      REGION: local
    ports:
      - target: 8080
        published: 8080
        mode: host
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        order: stop-first